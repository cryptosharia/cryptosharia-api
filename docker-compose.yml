services:
  postgres-dev:
    image: postgres:18-alpine
    container_name: cryptosharia-api-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cryptosharia_api_dev
    ports:
      - '5432:5432'
    volumes:
      - db_dev:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d cryptosharia_api_dev']
      interval: 1s
      timeout: 5s
      retries: 30

  redis-dev:
    image: redis:8-alpine
    container_name: cryptosharia-api-redis-dev
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 1s
      timeout: 5s
      retries: 30

  cryptosharia-api-dev:
    image: oven/bun:1
    container_name: cryptosharia-api-dev
    command: bash -c "bun install && bun run start:dev"
    ports:
      - '3000:3000'
    working_dir: /app
    volumes:
      - .:/app
      - node_modules_dev:/app/node_modules
    env_file:
      - .env
    depends_on:
      postgres-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy

volumes:
  db_dev:
  node_modules_dev:
