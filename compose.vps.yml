name: cryptosharia-vps
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks: [internal]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 2g
    cpus: 1.0
    logging: &logging
      driver: json-file
      options: {max-size: '10m', max-file: '3'}

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis_data:/data
    networks: [internal]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    cpus: 0.5
    logging: *logging

  api:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file: ${VPS_ENV_FILE:?Set VPS_ENV_FILE}
    environment:
      NODE_ENV: production
      SERVERLESS: 'false'
      PORT: '3000'
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [internal, proxy]
    volumes:
      - media_data:/data/media
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    logging: *logging

  media:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - media_data:/data/media:ro
      - ./nginx-media.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [proxy]
    logging: *logging

  migrate:
    profiles: [tools]
    build:
      context: .
      target: migration
    env_file: ${VPS_ENV_FILE:?Set VPS_ENV_FILE}
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
    depends_on:
      postgres: {condition: service_healthy}
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    logging: *logging

networks:
  internal:
    internal: true
  proxy:
    external: true
    name: cryptosharia_proxy
volumes:
  postgres_data:
  redis_data:
  media_data:
