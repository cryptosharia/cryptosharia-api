services:
  db-test:
    image: postgres:18-alpine
    container_name: cryptosharia-api-db-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cryptosharia_api_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d cryptosharia_api_test']
      interval: 1s
      timeout: 5s
      retries: 30
