services:
  db-dev:
    image: postgres:18-alpine
    container_name: <app-name>-db-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: <app_name>_dev
    ports:
      - '5432:5432'
    volumes:
      - db_dev:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d <app_name>_dev']

  app-dev:
    image: oven/bun:1
    container_name: <app-name>-app-dev
    command: bash -c "bun install && bun run start:dev"
    ports:
      - '3000:3000'
    working_dir: /app
    volumes:
      - .:/app
      - node_modules_dev:/app/node_modules
    env_file:
      - .env
    depends_on:
      db-dev:
        condition: service_healthy

volumes:
  db_dev:
  node_modules_dev:
