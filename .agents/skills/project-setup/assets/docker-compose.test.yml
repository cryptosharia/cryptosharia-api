services:
  postgres-test:
    image: postgres:18-alpine
    container_name: <app-name>-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: <app_name>_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d <app_name>_test']
      interval: 1s
      timeout: 5s
      retries: 30

  redis-test:
    image: redis:8-alpine
    container_name: <app-name>-redis-test
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 1s
      timeout: 5s
      retries: 30
